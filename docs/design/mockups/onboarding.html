<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding (4 bước) — NutriTrack mockup</title><link rel="stylesheet" href="mock.css"></head><body><p><a href="index.html">← Tất cả màn hình</a></p><h1 class="page">Onboarding (4 bước)</h1><p class="sub">Mục tiêu → thông tin cơ thể (có trạng thái lỗi validate) → kết quả BMR/TDEE/macro → nhắc nhở. Desktop: form căn giữa, không sidebar.</p><div class="stage"><figure><figcaption>Bước 1 · Mobile</figcaption><div class="app m" data-theme="light"><div class="statusbar"><span>9:41</span><span>●●● 100%</span></div><div class="scroll" style="gap:20px"><div class="between row"><button class="icon-btn" aria-label="Quay lại">‹</button><span class="small muted">Bước 1/4</span><span style="width:44px"></span></div><div class="stepper" role="progressbar" aria-valuenow="1" aria-valuemax="4" aria-label="Bước 1/4"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div><h1>Mục tiêu của bạn là gì?</h1><p class="muted">Chúng tôi dùng điều này để tính lượng calo phù hợp.</p></div><div class="opt on" role="radio" aria-checked="true"><span style="font-size:28px">🔻</span><div><b>Giảm cân</b><div class="small muted">Thâm hụt ~500 kcal/ngày</div></div></div><div class="opt " role="radio" aria-checked="false"><span style="font-size:28px">⚖️</span><div><b>Giữ cân</b><div class="small muted">Ăn đúng nhu cầu</div></div></div><div class="opt " role="radio" aria-checked="false"><span style="font-size:28px">💪</span><div><b>Tăng cân / tăng cơ</b><div class="small muted">Dư ~300 kcal/ngày</div></div></div><div class="grow"></div><button class="btn block">Tiếp tục</button></div></div></figure><figure><figcaption>Bước 2 · Mobile (lỗi validate)</figcaption><div class="app m" data-theme="light"><div class="statusbar"><span>9:41</span><span>●●● 100%</span></div><div class="scroll" style="gap:20px"><div class="between row"><button class="icon-btn" aria-label="Quay lại">‹</button><span class="small muted">Bước 2/4</span><span style="width:44px"></span></div><div class="stepper" role="progressbar" aria-valuenow="2" aria-valuemax="4" aria-label="Bước 2/4"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div><h1>Thông tin cơ thể</h1><p class="muted">Dùng để tính BMR & TDEE. Dữ liệu chỉ lưu cho bạn.</p></div><div class="seg" role="radiogroup" aria-label="Giới tính"><span class="on">Nam</span><span>Nữ</span></div><div class="grid g2"><div class="field"><label for="a">Tuổi</label><div class="input" id="a">28</div></div><div class="field"><label>Chiều cao (cm)</label><div class="input">172</div></div></div><div class="field"><label>Cân nặng hiện tại (kg)</label><div class="input">70</div></div><div class="field"><label>Cân nặng mục tiêu (kg)</label><div class="input error">75 → <span class="muted"> khác hướng với mục tiêu giảm cân</span></div><div class="err">⚠ Cân nặng mục tiêu phải nhỏ hơn 70 kg khi giảm cân.</div></div><div class="field"><label>Mức vận động</label><div class="input">Vận động nhẹ (1–3 buổi/tuần) ▾</div></div><div class="grow"></div><button class="btn block">Tiếp tục</button></div></div></figure><figure><figcaption>Bước 3 · Mobile</figcaption><div class="app m" data-theme="light"><div class="statusbar"><span>9:41</span><span>●●● 100%</span></div><div class="scroll" style="gap:20px"><div class="between row"><button class="icon-btn" aria-label="Quay lại">‹</button><span class="small muted">Bước 3/4</span><span style="width:44px"></span></div><div class="stepper" role="progressbar" aria-valuenow="3" aria-valuemax="4" aria-label="Bước 3/4"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div><h1>Kế hoạch dinh dưỡng của bạn</h1><p class="muted">Ước tính theo công thức Mifflin-St Jeor. Bạn có thể chỉnh sau.</p></div><div class="card row" style="gap:16px"><div class="ring" style="width:120px;height:120px" role="img" aria-label="1.900 kcal / ngày"><svg width="120" height="120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--track)" stroke-width="12"/><circle cx="60" cy="60" r="54" fill="none" stroke="var(--kcal)" stroke-width="12" stroke-linecap="round" stroke-dasharray="339.29200658769764 339.29200658769764"/></svg><div class="center"><div class="big" style="font-size:28px">1.900</div><div class="small muted">kcal / ngày</div></div></div><div class="grow col" style="gap:6px"><div class="between row small"><span class="muted">BMR</span><b>1.620</b></div><div class="between row small"><span class="muted">TDEE</span><b>2.230</b></div><div class="between row small"><span class="muted">Giảm cân</span><b>−330</b></div></div></div><div class="card col"><div><div class="mlabel"><span><span class="dot p"></span> Đạm (P)</span><span class="tp">120/120g</span></div><div class="mbar" role="progressbar" aria-valuenow="120" aria-valuemax="120" aria-label="Đạm (P)"><i class="p-fill" style="width:100%"></i></div></div><div><div class="mlabel"><span><span class="dot c"></span> Tinh bột (C)</span><span class="tc">215/215g</span></div><div class="mbar" role="progressbar" aria-valuenow="215" aria-valuemax="215" aria-label="Tinh bột (C)"><i class="c-fill" style="width:100%"></i></div></div><div><div class="mlabel"><span><span class="dot f"></span> Béo (F)</span><span class="tf">58/58g</span></div><div class="mbar" role="progressbar" aria-valuenow="58" aria-valuemax="58" aria-label="Béo (F)"><i class="f-fill" style="width:100%"></i></div></div></div><div class="small muted">Dự kiến đạt 65 kg sau ~10 tuần (0,5 kg/tuần). Đây không phải tư vấn y tế.</div><div class="grow"></div><button class="btn block">Tiếp tục</button></div></div></figure><figure><figcaption>Bước 4 · Mobile</figcaption><div class="app m" data-theme="light"><div class="statusbar"><span>9:41</span><span>●●● 100%</span></div><div class="scroll" style="gap:20px"><div class="between row"><button class="icon-btn" aria-label="Quay lại">‹</button><span class="small muted">Bướ big" style="font-size:28px">1.900</div><div class="small muted">kcal / ngày</div></div></div><div class="grow col" style="gap:6px"><div class="between row small"><span class="muted">BMR</span><b>1.620</b></div><div class="between row small"><span class="muted">TDEE</span><b>2.230</b></div><div class="between row small"><span class="muted">Giảm cân</span><b>−330</b></div></div></div><div class="card col"><div><div class="mlabel"><span><span class="dot p"></span> Đạm (P)</span><span class="tp">120/120g</span></div><div class="mbar" role="progressbar" aria-valuenow="120" aria-valuemax="120" aria-label="Đạm (P)"><i class="p-fill" style="width:100%"></i></div></div><div><div class="mlabel"><span><span class="dot c"></span> Tinh bột (C)</span><span class="tc">215/215g</span></div><div class="mbar" role="progressbar" aria-valuenow="215" aria-valuemax="215" aria-label="Tinh bột (C)"><i class="c-fill" style="width:100%"></i></div></div><div><div class="mlabel"><span><span class="dot f"></span> Béo (F)</span><span class="tf">58/58g</span></div><div class="mbar" role="progressbar" aria-valuenow="58" aria-valuemax="58" aria-label="Béo (F)"><i class="f-fill" style="width:100%"></i></div></div></div></div><div class="row" style="justify-content:flex-end"><button class="btn secondary">Chỉnh macro</button><button class="btn">Tiếp tục</button></div></div></main></div></figure></div></body></html>
