name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI-only throwaway credentials for the ephemeral service container.
  DATABASE_URL: postgresql://nutritrack:nutritrack_ci_only@localhost:5432/nutritrack?schema=public
  APP_URL: http://localhost:3000
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  MAIL_FROM: NutriTrack CI <no-reply@nutritrack.local>
  TZ: Asia/Ho_Chi_Minh
  PORT: "3000"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · typecheck · unit/integration · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: nutritrack
          POSTGRES_USER: nutritrack
          POSTGRES_PASSWORD: nutritrack_ci_only
          TZ: Asia/Ho_Chi_Minh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutritrack -d nutritrack"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pnpm store cache hit skips Prisma's postinstall, so generate explicitly.
      - run: pnpm exec prisma generate

      - name: Enable Postgres extensions (mirrors docker/postgres/init)
        run: |
          for f in docker/postgres/init/*.sql; do
            PGPASSWORD=nutritrack_ci_only psql -h localhost -U nutritrack -d nutritrack -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma db seed

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Start app (production build)
        env:
          # E2E-only: the smoke suite registers many users quickly. Never set in production.
          DISABLE_RATE_LIMIT: "1"
        run: |
          pnpm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/dang-nhap && exit 0
            sleep 2
          done
          cat /tmp/app.log; exit 1
      - name: E2E (4 projects)
        run: pnpm test:e2e
      - name: App log
        if: always()
        run: cat /tmp/app.log || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/results.json
          retention-days: 14
