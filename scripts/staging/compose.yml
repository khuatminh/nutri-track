# Internal staging only: every published port is bound to 127.0.0.1. Fake data only.
name: nutritrack_staging

x-app-env: &app-env
  DATABASE_URL: postgresql://nutritrack:${POSTGRES_PASSWORD:?run scripts/staging/up.sh}@db:5432/nutritrack?schema=public
  APP_URL: https://nutritrack-staging.localhost:8443
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: NutriTrack Staging <no-reply@nutritrack.local>
  TZ: Asia/Ho_Chi_Minh

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutritrack
      POSTGRES_USER: nutritrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/staging/up.sh}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - staging_db:/var/lib/postgresql/data
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"

  migrate:
    image: nutritrack-staging-app:${GIT_SHA:-local}
    environment: *app-env
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm exec prisma db seed"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: nutritrack-staging-app:${GIT_SHA:-local}
    build:
      context: ../..
      dockerfile: scripts/staging/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8480:8480"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy:/data
    depends_on:
      - app

volumes:
  staging_db:
  staging_caddy:
